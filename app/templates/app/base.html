{% comment %} <!DOCTYPE html>
<html>
<head>
    <title>Quora Clone</title>
</head>
<body>
    <h1><a href="{% url 'home' %}">Quora Clone</a></h1>
    {% if user.is_authenticated %}
        <p>Welcome, {{ user.username }} | <a href="{% url 'logout' %}">Logout</a> | <a href="{% url 'post_question' %}">Ask Question</a></p>
    {% else %}
        <p><a href="{% url 'login' %}">Login</a> | <a href="{% url 'signup' %}">Sign up</a></p>
    {% endif %}
    <hr>
    {% block content %}
    {% endblock %}
</body>
</html> {% endcomment %}
